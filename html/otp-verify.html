<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify OTP | Elenest Resort Booking System</title>
  <link rel="icon" type="image/png" href="../Images/icon.png">
  <link rel="stylesheet" href="../css/style.css?v=20261020-theme4">
  <script src="../js/theme.js?v=20261020-theme1"></script>
</head>
<body class="subpage">
  <header>
    <div class="content flex_space">
      <div class="logo">
        <a href="index.html" class="site-logo-link" aria-label="Elenest Resort home">
          <img class="site-logo" src="../Images/elenest_logo_pink.png" alt="Elenest Event Center">
        </a>
      </div>
      <div class="navlinks">
        <ul id="menulist" class="site-nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="otp-login.html">Change number</a></li>
        </ul>
        <button type="button" class="nav-menu-toggle" id="navMenuToggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="menulist">
          <span class="nav-menu-toggle__bar" aria-hidden="true"></span>
          <span class="nav-menu-toggle__bar" aria-hidden="true"></span>
          <span class="nav-menu-toggle__bar" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Enter verification code</h1>
      <p id="otpVerifyLead">We sent a one-time password to your phone.</p>
    </section>

    <section class="section">
      <article class="card auth-card">
        <h3>OTP verification</h3>
        <p class="auth-lead">Enter the code from your SMS. It expires in a few minutes.</p>
        <p id="otpVerifyMsg" class="auth-msg" hidden></p>
        <form id="otpVerifyForm" class="form-grid auth-form-single" autocomplete="one-time-code">
          <div class="full">
            <label for="otpCode">Verification code</label>
            <input
              id="otpCode"
              name="otp"
              type="text"
              inputmode="numeric"
              autocomplete="one-time-code"
              required
              maxlength="8"
              pattern="[0-9]{4,8}"
              placeholder="Enter OTP"
            >
          </div>
          <div class="full">
            <button class="btn" type="submit" id="otpVerifySubmit">Verify code</button>
          </div>
          <div class="full">
            <button class="btn btn--outline" type="button" id="otpResendBtn">Resend code</button>
          </div>
        </form>
        <p class="note auth-switch">
          Wrong number? <a href="otp-login.html">Go back</a>.
        </p>
      </article>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>Copyright 2026 Elenest Resort. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/ui-button-loading.js?v=20261012-btns1"></script>
  <script src="../js/otp-verification.js"></script>
  <script src="../js/header-nav.js?v=20260922-menu2"></script>
  <script>
    (function () {
      var Otp = window.ElenestOtp;
      var form = document.getElementById("otpVerifyForm");
      var msg = document.getElementById("otpVerifyMsg");
      var lead = document.getElementById("otpVerifyLead");
      var otpInput = document.getElementById("otpCode");
      var submitBtn = document.getElementById("otpVerifySubmit");
      var resendBtn = document.getElementById("otpResendBtn");
      var savedPhone = Otp.getSavedPhone();

      if (Otp.isVerifiedSession()) {
        window.location.replace("otp-dashboard.html");
        return;
      }

      if (!savedPhone) {
        window.location.replace("otp-login.html");
        return;
      }

      if (lead) {
        lead.textContent =
          "We sent a one-time password to " + savedPhone + ".";
      }

      function showMsg(text, isOk) {
        msg.hidden = false;
        msg.className = "auth-msg " + (isOk ? "auth-msg--ok" : "auth-msg--err");
        msg.textContent = text;
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        if (!Otp || typeof Otp.verifyOtp !== "function") {
          showMsg("Verification is unavailable. Refresh the page and try again.", false);
          return;
        }
        var BL = window.ElenestButtonLoading;
        if (BL) BL.set(submitBtn, true);
        msg.hidden = true;

        Otp.verifyOtp(savedPhone, otpInput ? otpInput.value : "").then(function (result) {
          if (result.ok) {
            window.location.href = "otp-dashboard.html";
            return;
          }
          if (BL) BL.set(submitBtn, false);
          showMsg(result.message, false);
        }).catch(function () {
          if (BL) BL.set(submitBtn, false);
          showMsg("Could not verify the code. Check your connection and try again.", false);
        });
      });

      if (resendBtn) {
        resendBtn.addEventListener("click", function () {
          if (!Otp || typeof Otp.sendOtp !== "function") {
            showMsg("Resend is unavailable. Refresh the page and try again.", false);
            return;
          }
          var BL = window.ElenestButtonLoading;
          if (BL) BL.set(resendBtn, true);
          msg.hidden = true;
          Otp.sendOtp(savedPhone).then(function (result) {
            if (BL) BL.set(resendBtn, false);
            showMsg(
              result.ok ? "A new code was sent to your phone." : result.message,
              result.ok
            );
          }).catch(function () {
            if (BL) BL.set(resendBtn, false);
            showMsg("Could not resend the code. Check your connection and try again.", false);
          });
        });
      }
    })();
  </script>
</body>
</html>
