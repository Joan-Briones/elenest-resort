<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Login | Elenest Resort Booking System</title>
  <link rel="icon" type="image/png" href="../Images/icon.png">
  <link rel="stylesheet" href="../css/style.css?v=20261020-theme1">
  <script src="../js/theme.js?v=20261020-theme1"></script>
</head>
<body class="subpage">
  <header>
    <div class="content flex_space">
      <div class="logo">
        <a href="index.html" class="site-logo-link" aria-label="Elenest Resort home">
          <img class="site-logo" src="../Images/elenest_logo_pink.png" alt="Elenest Event Center">
        </a>
      </div>
      <div class="navlinks">
        <ul id="menulist" class="site-nav-list">
          <li><a href="index.html">Home</a></li>
          <li class="role-login-nav" id="roleLoginNav">
            <a href="login.html" class="role-login-trigger staff-access-btn" id="roleLoginTrigger" aria-label="Sign In">Sign In</a>
          </li>
        </ul>
        <button type="button" class="nav-menu-toggle" id="navMenuToggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="menulist">
          <span class="nav-menu-toggle__bar" aria-hidden="true"></span>
          <span class="nav-menu-toggle__bar" aria-hidden="true"></span>
          <span class="nav-menu-toggle__bar" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Elenest Resort Booking System</h1>
      <p>Verify your phone number to continue. We will send a one-time code by SMS.</p>
    </section>

    <section class="section">
      <article class="card auth-card">
        <h3>Phone verification</h3>
        <p class="auth-lead">Enter your Philippine mobile number (09XXXXXXXXX).</p>
        <p id="otpLoginMsg" class="auth-msg" hidden></p>
        <form id="otpLoginForm" class="form-grid auth-form-single" autocomplete="on">
          <div class="full">
            <label for="otpPhone">Phone number</label>
            <input
              id="otpPhone"
              name="phone"
              type="tel"
              autocomplete="tel"
              required
              inputmode="numeric"
              maxlength="11"
              pattern="09[0-9]{9}"
              placeholder="09XXXXXXXXX"
            >
          </div>
          <div class="full">
            <button class="btn" type="submit" id="otpLoginSubmit">Send verification code</button>
          </div>
        </form>
        <p class="note auth-switch">
          Already verified? <a href="otp-dashboard.html">Go to dashboard</a>.
        </p>
      </article>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>Copyright 2026 Elenest Resort. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/ui-button-loading.js?v=20261012-btns1"></script>
  <script src="../js/otp-verification.js"></script>
  <script src="../js/header-nav.js?v=20260922-menu2"></script>
  <script src="../js/role-login.js"></script>
  <script>
    (function () {
      var Otp = window.ElenestOtp;
      var form = document.getElementById("otpLoginForm");
      var msg = document.getElementById("otpLoginMsg");
      var phoneInput = document.getElementById("otpPhone");
      var submitBtn = document.getElementById("otpLoginSubmit");

      if (Otp.isVerifiedSession()) {
        window.location.replace("otp-dashboard.html");
        return;
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        if (!Otp || typeof Otp.sendOtp !== "function") {
          msg.hidden = false;
          msg.className = "auth-msg auth-msg--err";
          msg.textContent = "Phone verification is unavailable. Refresh the page and try again.";
          return;
        }
        var BL = window.ElenestButtonLoading;
        if (BL) BL.set(submitBtn, true);
        msg.hidden = true;

        Otp.sendOtp(phoneInput ? phoneInput.value : "").then(function (result) {
          if (result.ok) {
            window.location.href = "otp-verify.html";
            return;
          }
          if (BL) BL.set(submitBtn, false);
          msg.hidden = false;
          msg.className = "auth-msg auth-msg--err";
          msg.textContent = result.message;
        }).catch(function () {
          if (BL) BL.set(submitBtn, false);
          msg.hidden = false;
          msg.className = "auth-msg auth-msg--err";
          msg.textContent = "Could not send the code. Check your connection and try again.";
        });
      });
    })();
  </script>
</body>
</html>
